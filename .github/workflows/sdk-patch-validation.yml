name: Validate and build MetaTube server with native providers
# Retry marker: re-run SDK integration validation on the current tree.

on:
  push:
    branches:
      - feat/amane-provider-migration
    paths:
      - "patches/metatube-sdk-go/**"
      - "provider/httpretry/**"
      - "provider/jav321/**"
      - "provider/avbaseactor/**"
      - "provider/airav/**"
      - "provider/avsox/**"
      - "provider/fc2club/**"
      - "provider/freejavbt/**"
      - "provider/giga/**"
      - "provider/iqqtv/**"
      - "provider/javdb/**"
      - "provider/minnano/**"
      - "provider/prestige/**"
      - "provider/wikipediaactor/**"
      - "provider/javlibrary/**"
      - "provider/xcity/**"
      - ".github/scripts/validate-provider-integration.sh"
      - ".github/scripts/integrate-category-routing.sh"
      - ".github/overlays/**"
      - "routing/**"
      - ".github/scripts/build-metatube-server.sh"
      - ".github/workflows/sdk-patch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metaX migration workspace
        uses: actions/checkout@v4

      - name: Checkout pinned MetaTube SDK
        uses: actions/checkout@v4
        with:
          repository: metatube-community/metatube-sdk-go
          ref: c62584675c593816cc07e7b5b977d14c7eb505a3
          path: upstream-sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream-sdk/go.mod
          cache: true
          cache-dependency-path: upstream-sdk/go.sum

      - name: Apply patches, integrate all native providers, test, and build server
        run: |
          bash .github/scripts/build-metatube-server.sh "$GITHUB_WORKSPACE/upstream-sdk" "$GITHUB_WORKSPACE/dist/metatube-server"

      - name: Upload built MetaTube server
        uses: actions/upload-artifact@v4
        with:
          name: metatube-server-${{ github.sha }}
          path: dist/metatube-server
          if-no-files-found: error
          retention-days: 7
