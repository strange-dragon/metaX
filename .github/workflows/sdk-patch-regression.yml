name: Temporary SDK patch regression

on:
  push:
    branches:
      - feat/amane-provider-migration
    paths:
      - 'patches/metatube-sdk-go/0006-fc2ppvdb-validate-detail-url.patch'
      - '.github/workflows/sdk-patch-regression.yml'

jobs:
  fc2ppvdb-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metaX
        uses: actions/checkout@v4
      - name: Checkout pinned MetaTube SDK
        uses: actions/checkout@v4
        with:
          repository: metatube-community/metatube-sdk-go
          ref: c62584675c593816cc07e7b5b977d14c7eb505a3
          path: sdk
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
          cache-dependency-path: sdk/go.sum
      - name: Check and apply FC2PPVDB patch
        working-directory: sdk
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0006-fc2ppvdb-validate-detail-url.patch"
          git apply "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0006-fc2ppvdb-validate-detail-url.patch"
      - name: Check formatting
        working-directory: sdk
        run: |
          test -z "$(gofmt -l provider/fc2ppvdb/fc2ppvdb.go provider/fc2ppvdb/fc2ppvdb_test.go)"
      - name: Run deterministic FC2PPVDB tests
        working-directory: sdk
        run: go test ./provider/fc2ppvdb -run '^TestFC2PPVDB(NormalizeMovieID|ParseMovieIDFromURL|GetMovieInfoByIDRejectsInvalidID)$' -count=1
