name: Temporary ThePornDB patch verification

on:
  push:
    branches:
      - feat/amane-provider-migration
    paths:
      - "patches/metatube-sdk-go/0008-theporndb-validate-detail-url.patch"
      - ".github/workflows/theporndb-patch-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theporndb-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metaX migration workspace
        uses: actions/checkout@v4

      - name: Checkout pinned MetaTube SDK
        uses: actions/checkout@v4
        with:
          repository: metatube-community/metatube-sdk-go
          ref: c62584675c593816cc07e7b5b977d14c7eb505a3
          path: upstream-sdk

      - name: Apply ThePornDB patch
        working-directory: upstream-sdk
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0008-theporndb-validate-detail-url.patch"
          git apply "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0008-theporndb-validate-detail-url.patch"

      - name: Assert patched files exist
        working-directory: upstream-sdk
        run: |
          test -f provider/theporndb/video.go
          test -f provider/theporndb/actor.go
          test -f provider/theporndb/validation_test.go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream-sdk/go.mod
          cache: true
          cache-dependency-path: upstream-sdk/go.sum

      - name: Verify formatting
        working-directory: upstream-sdk
        run: |
          files="provider/theporndb/video.go provider/theporndb/actor.go provider/theporndb/validation_test.go"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run deterministic ThePornDB validation tests
        working-directory: upstream-sdk
        run: go test ./provider/theporndb -run '^(TestParseThePornDBDetailID|TestThePornDBVideoGetMovieInfoByIDRejectsInvalidID|TestThePornDBActorGetActorInfoByIDRejectsInvalidID)$' -count=1
