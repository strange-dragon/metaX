name: Format Go sources (feature branch)

on:
  push:
    branches:
      - feat/amane-provider-migration

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Resolve module checksums
        run: go mod tidy
      - name: Format Go files
        run: |
          files="$(git ls-files '*.go')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
      - name: Commit formatter changes
        run: |
          git add go.mod $(git ls-files '*.go')
          if [ -f go.sum ]; then
            git add go.sum
          fi
          if git diff --cached --quiet; then
            echo "No dependency or formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: tidy dependencies and format Go sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
