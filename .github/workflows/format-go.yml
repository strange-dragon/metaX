name: Format Go sources (feature branch)

on:
  push:
    branches:
      - feat/amane-provider-migration

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Format Go files
        run: |
          files="$(git ls-files '*.go')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
      - name: Commit formatter changes
        run: |
          git add $(git ls-files '*.go') go.mod go.sum
          if git diff --cached --quiet; then
            echo "Go files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply gofmt to Go sources"
          git push origin "${GITHUB_REF_NAME}"
