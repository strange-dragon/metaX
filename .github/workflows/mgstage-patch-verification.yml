name: Temporary MGStage patch verification

on:
  push:
    branches:
      - feat/amane-provider-migration
    paths:
      - 'patches/metatube-sdk-go/0007-mgstage-validate-detail-url.patch'
      - '.github/workflows/mgstage-patch-verification.yml'

jobs:
  mgstage-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metaX
        uses: actions/checkout@v4
      - name: Checkout pinned MetaTube SDK
        uses: actions/checkout@v4
        with:
          repository: metatube-community/metatube-sdk-go
          ref: c62584675c593816cc07e7b5b977d14c7eb505a3
          path: sdk
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Check and apply MGStage patch
        working-directory: sdk
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0007-mgstage-validate-detail-url.patch"
          git apply "$GITHUB_WORKSPACE/patches/metatube-sdk-go/0007-mgstage-validate-detail-url.patch"
      - name: Check formatting
        working-directory: sdk
        run: |
          test -z "$(gofmt -l provider/mgstage/mgstage.go provider/mgstage/mgstage_test.go)"
      - name: Run deterministic MGStage tests
        working-directory: sdk
        run: go test ./provider/mgstage -run '^TestMGS(NormalizeMovieID|ParseMovieIDFromURL|GetMovieInfoByIDRejectsInvalidID|GetMovieReviewsByIDRejectsInvalidID)$' -count=1
